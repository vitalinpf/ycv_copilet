<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>Prototypes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,'Inter',system-ui,sans-serif;background:#09090B;color:#fff;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    padding:40px 20px calc(40px + env(safe-area-inset-bottom));
    padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right));}
  .logo{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.3);text-transform:uppercase;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;text-align:center;}
  .sub{font-size:13px;color:#9C9CAB;text-align:center;margin-top:6px;}
  .list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;}
  .card{display:flex;align-items:center;min-height:56px;background:#151519;border:1px solid rgba(255,255,255,.1);border-radius:16px;
    padding:14px 18px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s;}
  .card:hover{background:#212127;border-color:rgba(32,170,216,.5);}
  .card:active{background:#212127;}
  .card-name{font-size:15px;font-weight:700;line-height:1.35;}
  .card-desc{font-size:12px;color:#9C9CAB;margin-top:3px;line-height:1.45;}
  .foot{font-size:12px;color:rgba(255,255,255,.3);text-align:center;line-height:1.8;}
  @media (max-width:480px){ body{justify-content:flex-start;gap:22px;padding-top:44px;} h1{font-size:22px;} .list{max-width:none;} .card{border-radius:14px;padding:13px 16px;} }
</style>
</head>
<body>
<script>
/* ─────────── EDIT ONLY THIS ARRAY ─────────── */
var PROTOTYPES = [
  { name: 'Edit Copilot',
    desc: '對話下指令 → 確認計畫 → 背景執行 → 逐項檢查／復原',
    file: 'edit-copilot-prototype.html' }
];
/* ──────────────────────────────────────────── */
if (PROTOTYPES.length === 1) location.replace(PROTOTYPES[0].file);
</script>
<div class="logo">YouCam</div>
<div><h1>Prototypes</h1><div class="sub" id="sub"></div></div>
<div class="list" id="list"></div>
<p class="foot">點選一個 prototype 開啟<br>Tap a prototype to open it</p>
<script>
(function () {
  if (PROTOTYPES.length === 1) return;
  document.getElementById('sub').textContent = PROTOTYPES.length + ' prototypes in this folder';
  var list = document.getElementById('list');
  PROTOTYPES.forEach(function (p) {
    var card = document.createElement('a'); card.className = 'card'; card.href = p.file;
    var body = document.createElement('div');
    var name = document.createElement('div'); name.className = 'card-name'; name.textContent = p.name; body.appendChild(name);
    if (p.desc) { var d = document.createElement('div'); d.className = 'card-desc'; d.textContent = p.desc; body.appendChild(d); }
    card.appendChild(body); list.appendChild(card);
  });
})();
</script>
</body>
</html>
